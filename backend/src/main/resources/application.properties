spring.config.import=optional:file:../.env[.properties]
server.port=${API_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:appdb}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:apppassword}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true